name: Daily Value Bets Analysis

on:
  schedule:
    - cron: '0 14 * * *'  # 08:00 México (UTC-6)
  workflow_dispatch:       # trigger manual desde GitHub app
  push:
    branches: [main]       # también corre en cada push a main

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - name: Run value bet detector
        env:
          BIZZOIRO_API_KEY: ${{ secrets.BIZZOIRO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm start
